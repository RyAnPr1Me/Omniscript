name: Prettier Formatter Check

on:
  # Manual trigger
  workflow_dispatch:

  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push changes
      pull-requests: write # For creating/updating pull requests (if needed)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important to get the full history for commit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Use the Node.js version your project requires

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        id: prettier_check
        run: |
          if npx prettier --check . ; then
            echo "Formatting is ok"
          else
            echo "Formatting issues found"
            exit 1
          fi

      - name: Fix formatting with Prettier (if issues found)
        if: ${{ failure() }}
        run: |
          npx prettier --write .

      - name: Create a commit with the formatting changes
        if: ${{ failure() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix formatting with Prettier" || echo "No changes to commit"
          git push
