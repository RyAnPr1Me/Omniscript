name: Prettier Formatter Check

on:
  # Manual trigger
  workflow_dispatch:

  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions apply to all jobs in this workflow
permissions:
  contents: write  # Needed to push changes
  pull-requests: write # For creating/updating pull requests (if needed)
  # IMPORTANT: If Prettier might change the workflow file itself,
  # or if another workflow attempts to edit another workflow file,
  # you'll need the "workflows: write" permission.  However,
  # *be very careful* when enabling this.  It can lead to
  # unintended behavior.
  workflows: write  # Enable with CAUTION!  Only if needed.


jobs:
  prettier:
    runs-on: ubuntu-latest
    # Permissions are inherited from the top level,
    # or you could override them here if needed,
    # but typically you wouldn't need to repeat them if set at the top.
    # permissions: # <-- REMOVED OR COMMENTED OUT
    #   contents: write
    #   ...


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full git history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        id: prettier_check
        run: |
          if npx prettier --check . ; then
            echo "Formatting is ok"
          else
            echo "Formatting issues found"
            exit 1
          fi

      - name: Fix formatting with Prettier (if issues found)
        if: ${{ failure() }}
        run: |
          npx prettier --write .

      - name: Create a commit with the formatting changes
        if: ${{ failure() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix formatting with Prettier" || echo "No changes to commit"
          git push
