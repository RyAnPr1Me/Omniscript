name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: 'Lint, Build, Test, and Report Status'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write   # grant permission to open issues

    env:
      NPM_CONFIG_PRODUCTION: false
      NPM_CONFIG_LOGLEVEL: verbose

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      # Debug Steps
      - name: 'Debug: Print Environment Variables'
        run: env | sort

      - name: 'Debug: Print Node.js Version'
        run: node --version

      - name: 'Debug: Print npm Info'
        run: |
          npm --version
          npm config list

      - name: 'Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Cache npm dependencies'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 'Debug: List files before install'
        run: ls -la

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Debug: List files after install'
        run: ls -la

      # Core Lint/Build/Test
      - name: 'Lint'
        id: lint
        run: npm run lint

      - name: 'Build'
        id: build
        run: npm run build

      - name: 'Test'
        id: test
        run: npm test

      # Report status on success
      - name: 'Report Status and Update README'
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ "${{ steps.test.outcome }}" == "success" ]; then
            STATUS="FUNCTIONAL"
          else
            STATUS="NONFUNCTIONAL"
          fi

          echo "STATUS=$STATUS" > README.md.temp
          grep -v "^STATUS=" README.md 2>/dev/null || true >> README.md.temp
          mv README.md.temp README.md

          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "CI: Build status updated to $STATUS"
            git push origin HEAD --force-with-lease
          else
            echo "No README changes to commit."
          fi

      # Debug on any failure
      - name: 'Debug on Failure'
        if: failure()
        run: |
          echo "❌ Workflow failed in job: build-test"
          echo "Lint:    ${{ steps.lint.outcome }}"
          echo "Build:   ${{ steps.build.outcome }}"
          echo "Test:    ${{ steps.test.outcome }}"
          echo "--- Logs of failing step ---"
          # prints last 200 lines of the failing step's logs
          echo "${{ toJson(steps) }}" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .value.name' | \
            xargs -I{} sh -c "echo \"--- {} logs ---\"; sed -n '\$((\$(wc -l < $GITHUB_STEP_SUMMARY)-200)),\$p' $GITHUB_STEP_SUMMARY || true"

      # Create GitHub Issue on failure
      - name: 'Create Issue on Failure'
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failed = Object.values(steps)
              .filter(s => s.outcome === 'failure')
              .map(s => `- **${s.name}** failed`)
              .join('\n');
            const body = `
            ⚠️ **CI workflow failed** for \`${{ github.workflow }}\` on \`${{ github.ref }}\`.

            **Failed Steps:**
            ${failed}

            You can view the full logs [here](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).

            _Automated issue opened by CI._
            `;
            await github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Failure: ${context.workflow} on ${context.ref.replace('refs/heads/', '')}`,
              body: body,
            })
