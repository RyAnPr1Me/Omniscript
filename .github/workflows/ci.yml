name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    # Ensure devDependencies (like eslint) get installed
    env:
      NPM_CONFIG_PRODUCTION: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 :contentReference[oaicite:0]{index=0}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' :contentReference[oaicite:1]{index=1}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules- :contentReference[oaicite:2]{index=2}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
