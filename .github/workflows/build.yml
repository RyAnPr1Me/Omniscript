name: Build and Package Omniscript

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Ensure release folder exists across all OS
      - name: Create release folder
        run: |
          mkdir -p release
        shell: bash

      # Windows Packaging
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco upgrade innosetup -y

      # Prepare production dependencies for Windows installer
      - name: Prepare production dependencies
        if: matrix.os == 'windows-latest'
        run: |
          # Save dev dependencies state
          npm ci --omit=dev
        shell: bash

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: iscc installer.iss

      # Restore all dependencies after installer build
      - name: Restore all dependencies
        if: matrix.os == 'windows-latest'
        run: npm install

      - name: Move Windows Artifact
        if: matrix.os == 'windows-latest'
        run: |
          cp Output/OmniscriptSetup-*.exe release/

      # Linux Packaging
      - name: Install fpm (for DEB/RPM)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install --no-document fpm

      - name: Build Linux Package (DEB)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build/linux/usr/local/bin
          cp -r dist/* build/linux/usr/local/bin/
          fpm -s dir -t deb -n omniscript -v 1.0.0 -C build/linux .
          cp ./*.deb release/

      # macOS Packaging
      - name: Build macOS PKG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p build/macos/usr/local/bin
          cp -r dist/* build/macos/usr/local/bin/
          pkgbuild --root build/macos --identifier com.omniscript.lang --version 1.0.0 release/Omniscript.pkg

      # Upload all artifacts into one artifact bucket
      - name: Upload All Installers
        uses: actions/upload-artifact@v4
        with:
          name: Omniscript-Installers-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  # Create GitHub Release on tag push
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Move all installer files to release-assets folder
          find artifacts/ -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.pkg" \) -exec cp {} release-assets/ \;
          # List what we're releasing
          ls -lah release-assets/

      - name: Extract release notes
        id: extract_notes
        run: |
          # Extract version from tag (e.g., v2.1.0 -> 2.1.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Try to extract release notes from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Extract notes for this version (basic extraction)
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "## Omniscript $VERSION" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "See [CHANGELOG.md](CHANGELOG.md) for full release notes." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "release_notes=Release $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Omniscript ${{ steps.extract_notes.outputs.version }}
          body: ${{ steps.extract_notes.outputs.release_notes }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
