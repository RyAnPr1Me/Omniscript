name: Build and Package Omniscript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Ensure release folder exists across all OS
      - name: Create release folder
        run: |
          mkdir -p release
        shell: bash

      # Windows Packaging
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco upgrade innosetup -y

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        run: iscc installer.iss

      - name: Move Windows Artifact
        if: matrix.os == 'windows-latest'
        run: |
          cp Output/OmniscriptSetup-*.exe release/

      # Linux Packaging
      - name: Install fpm (for DEB/RPM)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install --no-document fpm

      - name: Build Linux Package (DEB)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build/linux/usr/local/bin
          cp -r dist/* build/linux/usr/local/bin/
          fpm -s dir -t deb -n omniscript -v 1.0.0 -C build/linux .
          cp ./*.deb release/

      # macOS Packaging
      - name: Build macOS PKG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p build/macos/usr/local/bin
          cp -r dist/* build/macos/usr/local/bin/
          pkgbuild --root build/macos --identifier com.omniscript.lang --version 1.0.0 release/Omniscript.pkg

      # Upload all artifacts into one artifact bucket
      - name: Upload All Installers
        uses: actions/upload-artifact@v4
        with:
          name: Omniscript-Installers
          path: release/
          if-no-files-found: error
          overwrite: true
